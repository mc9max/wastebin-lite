[build]
  builder = "DOCKERFILE"
  dockerfilePath = "Dockerfile"
  watchPatterns = ["Dockerfile"]

[deploy]
  healthcheckPath = "/"
  healthcheckTimeout = 100
  numReplicas = 1
  restartPolicyType = "ON_FAILURE"
  restartPolicyMaxRetries = 3

[[volumes]]
  name = "wastebin_data"
  mountPath = "/data"
  sizeGB = 1
